<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Halcyon H9 — 原创程序化超跑配置器（three.js）">
<meta name="theme-color" content="#0c0d10">
<title>Halcyon H9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed studio canvas; wordmark top-left; configurator panel docked right (bottom sheet on phones);
   one action rail bottom-centre for doors, wing, lights, poses and camera.
   Deliberately single-theme: a dark photo studio, so every colour is set explicitly. */
:root {
  --studio: #0c0d10;
  --ink: #ecebe6;
  --ink-dim: #9b9ea6;
  --ink-faint: #6e717a;
  --glass: rgba(15, 16, 20, 0.72);
  --line: rgba(236, 235, 230, 0.10);
  --line-strong: rgba(236, 235, 230, 0.46);
  --wash: rgba(236, 235, 230, 0.08);
  --wash-strong: rgba(236, 235, 230, 0.14);
  --livery-red: #d0102c;
  --font-display: "Archivo", "Noto Sans SC", "Arial Black", sans-serif;
  --font-ui: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --panel-w: 332px;
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --panel-space: 0px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--studio);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#scene {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  outline: none;
}
#scene:active { cursor: grabbing; }

.mark {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: var(--gutter-l);
  margin-left: 6px;
  display: flex; align-items: center; gap: 12px;
  pointer-events: none;
  opacity: 0; transform: translateY(-4px);
  transition: opacity .8s ease .4s, transform .8s ease .4s;
}
.mark-brand { font-family: var(--font-display); font-style: italic; font-weight: 800; font-stretch: 125%; font-size: 15px; letter-spacing: 0.24em; }
.mark-model { font-weight: 300; font-size: 15px; letter-spacing: 0.08em; color: var(--ink-dim); padding-left: 12px; border-left: 1px solid var(--line); }
.mark-model b { font-weight: 700; color: var(--livery-red); }

/* ---------- action rail ---------- */
body.panel-open { --panel-space: calc(var(--panel-w) + var(--gutter-r) + 8px); }
.rail {
  position: fixed;
  left: calc((100% - var(--panel-space)) / 2);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  transform: translate(-50%, 8px);
  width: max-content;
  max-width: calc(100% - var(--panel-space) - var(--gutter-l) - var(--gutter-r));
  box-sizing: border-box;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px 12px;
  padding: 7px 10px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 999px;
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  backdrop-filter: blur(16px) saturate(1.2);
  opacity: 0;
  transition: opacity .7s ease .6s, transform .7s ease .6s, left .45s ease;
}
.group { display: flex; align-items: center; gap: 2px; }
.sep { width: 1px; height: 20px; background: var(--line); }
.rail.wrapped { border-radius: 22px; }
.rail.wrapped .sep { display: none; }
.rail.wrapped .group { flex-wrap: wrap; justify-content: center; }
.rail.measure { width: max-content; max-width: none; flex-wrap: nowrap; }
.rail.measure .sep { display: block; }
.rail.measure .group { flex-wrap: nowrap; }
.tog {
  width: 34px; height: 34px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-dim);
  cursor: pointer;
  transition: background .2s ease, color .2s ease, opacity .2s ease;
}
.tog svg { width: 18px; height: 18px; }
.tog:hover { color: var(--ink); }
.tog[aria-pressed="true"] { color: var(--ink); background: var(--wash-strong); }
.tog:disabled { opacity: .3; cursor: default; }
.seg {
  height: 30px; padding: 0 11px;
  border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-dim);
  font-size: 12.5px; font-weight: 500; letter-spacing: 0.06em; line-height: 1;
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
}
.seg:hover { color: var(--ink); }
.seg[aria-checked="true"], .seg[aria-current="true"] { color: var(--ink); background: var(--wash-strong); }
.poses .seg[aria-checked="true"] { box-shadow: inset 0 -2px 0 var(--livery-red); }

.tog[data-toggle="sound"] .snd-off { display: none; }
.tog[data-toggle="sound"][aria-pressed="false"] .snd-on { display: none; }
.tog[data-toggle="sound"][aria-pressed="false"] .snd-off { display: inline; opacity: .7; }

/* ---------- telemetry ---------- */
.hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 56px);
  left: var(--gutter-l);
  margin-left: 6px;
  width: 172px;
  box-sizing: border-box;
  padding: 12px 14px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 16px;
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  backdrop-filter: blur(16px) saturate(1.2);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  opacity: 0; transform: translateY(-4px);
  transition: opacity .4s ease, transform .4s ease;
}
body.hud-on .hud { opacity: 1; transform: none; }
.hud-top { display: flex; align-items: baseline; gap: 6px; }
.hud-speed { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 34px; line-height: 1; min-width: 2.2ch; }
.hud-unit { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; }
.hud-gear { margin-left: auto; align-self: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; padding: 4px 7px; border: 1px solid var(--line-strong); border-radius: 7px; min-width: 1ch; text-align: center; }
.hud-rpm { height: 3px; margin: 11px 0 12px; background: var(--wash-strong); border-radius: 2px; overflow: hidden; }
.hud-rpm i { display: block; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: background .2s; }
.hud-rpm i.red { background: var(--livery-red); }
.hud-g { display: flex; align-items: center; gap: 12px; }
.hud-g svg { width: 50px; height: 50px; flex: none; fill: none; stroke: rgba(236,235,230,.22); stroke-width: 1.2; }
.hud-g .dot { fill: var(--livery-red); stroke: none; }
.hud-g span { font-size: 12px; color: var(--ink-dim); }
.hud-g b { font-size: 18px; color: var(--ink); font-weight: 700; }
.hud-aero { display: none; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); gap: 6px; }
body.aero-on .hud-aero { display: grid; }
.hud-aero div { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.hud-aero dt { color: var(--ink-dim); }
.hud-aero dd { margin: 0; color: var(--ink-dim); }
.hud-aero b { color: var(--ink); font-weight: 700; font-size: 13px; }

/* ---------- configurator panel ---------- */
.panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: var(--gutter-r);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: var(--panel-w);
  display: flex; flex-direction: column;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 20px;
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  transform: translateX(calc(100% + 40px));
  visibility: hidden;
  transition: transform .45s ease, visibility 0s linear .45s;
  z-index: 3;
}
body.panel-open .panel { transform: none; visibility: visible; transition: transform .45s ease, visibility 0s; }
.panel-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; height: 32px; padding: 0 9px;
  border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-dim);
  font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
  cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--wash-strong); }
.panel-close { flex: none; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 20px; scrollbar-width: thin; }
.pane { display: grid; gap: 22px; }
.pane[hidden] { display: none; }
.field { display: grid; gap: 11px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.field-head h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: var(--ink-faint); }
.field-head span { font-size: 12px; color: var(--ink-dim); }

.sw-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 8px; justify-items: center; }
.sw-row { display: flex; flex-wrap: wrap; gap: 10px; }
.sw {
  width: 34px; height: 34px; padding: 0;
  border: 0; border-radius: 50%;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
  transition: transform .2s ease, box-shadow .2s ease;
}
.sw.sm { width: 28px; height: 28px; }
.sw:hover { transform: scale(1.08); }
.sw[aria-checked="true"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 0 0 2px var(--studio), 0 0 0 3.5px var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--ink-dim);
  font-size: 13px; font-weight: 500; line-height: 1;
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease, background .2s ease;
}
.chip:hover { color: var(--ink); border-color: rgba(236,235,230,0.22); }
.chip[aria-checked="true"] { color: var(--ink); border-color: var(--line-strong); background: var(--wash); }
.chips.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chip.tile { flex-direction: column; justify-content: center; height: auto; padding: 12px 8px 10px; border-radius: 14px; gap: 8px; }
.chip.tile svg { width: 40px; height: 32px; }
.chip.tile span { font-size: 12.5px; }
.fin { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); }
.fin[data-fin="metallic"] { background: radial-gradient(circle at 32% 28%, var(--p1), var(--p2) 48%, var(--p3)); }
.fin[data-fin="pearl"] { background: radial-gradient(circle at 72% 76%, rgba(255,196,240,0.55), transparent 55%), radial-gradient(circle at 32% 28%, #ffffff, var(--p1) 24%, var(--p2) 58%, var(--p3)); }
.fin[data-fin="solid"] { background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.9) 0 7%, var(--p2) 20%, var(--p2) 72%, var(--p3)); }
.fin[data-fin="matte"] { background: var(--p2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
.fin[data-fin="chrome"] { background: linear-gradient(160deg, #ffffff 0%, var(--p1) 22%, #0e0e10 46%, var(--p1) 60%, #ffffff 76%, var(--p3) 100%); }
.fin[data-fin="chameleon"] { background: conic-gradient(from 210deg, #6b2fd6, #0fb5b0, #e6c04a, #c2306b, #6b2fd6); }
.fin[data-fin="carbon"] { background: repeating-linear-gradient(45deg, #2c2d31 0 3px, #101113 3px 6px); }
.duo { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); }

.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.preset {
  display: grid; gap: 12px; justify-items: start;
  padding: 14px 12px 12px;
  border: 1px solid var(--line); border-radius: 16px;
  background: transparent; color: var(--ink-dim);
  cursor: pointer; text-align: left;
  transition: border-color .2s ease, background .2s ease, color .2s ease;
}
.preset:hover { border-color: rgba(236,235,230,0.22); color: var(--ink); }
.preset[aria-checked="true"] { border-color: var(--line-strong); background: var(--wash); color: var(--ink); }
.preset-look { display: flex; align-items: center; }
.pc { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 2px #14151a; margin-left: -6px; }
.pc.big { width: 34px; height: 34px; margin-left: 0; }
.pc.small { width: 14px; height: 14px; }
.preset-name { font-size: 13.5px; font-weight: 500; letter-spacing: 0.04em; }

button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- loader ---------- */
.loader {
  position: fixed; inset: 0;
  display: grid; place-items: center; align-content: center; gap: 18px;
  background: var(--studio);
  transition: opacity .9s ease;
  z-index: 5;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.loader-mark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-stretch: 125%; font-size: clamp(22px, 5vw, 34px); letter-spacing: 0.3em; padding-left: 0.3em; }
.loader-track { width: min(220px, 60vw); height: 2px; background: var(--line); overflow: hidden; }
#loader-bar { height: 100%; background: var(--ink); transform: scaleX(0.02); transform-origin: left; transition: transform .35s ease; }
#loader-msg { min-height: 1em; max-width: 36ch; text-align: center; font-size: 13px; line-height: 1.5; color: var(--ink-dim); }

body.is-ready .loader { opacity: 0; pointer-events: none; }
body.is-ready .mark { opacity: 1; transform: none; }
body.is-ready .rail { opacity: 1; transform: translate(-50%, 0); }

/* ---------- phones and narrow windows: panel becomes a bottom sheet ---------- */
@media (max-width: 899px) and (max-aspect-ratio: 5/4), (max-width: 639px) {
  body.panel-open { --panel-space: 0px; }
  .panel {
    top: auto; left: var(--gutter-l); right: var(--gutter-r);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    width: auto; max-height: min(64%, 560px);
    transform: translateY(calc(100% + 32px));
  }
  body.panel-open .rail { opacity: 0; pointer-events: none; }
  .rail { border-radius: 20px; padding: 8px; gap: 6px 8px; width: calc(100% - var(--gutter-l) - var(--gutter-r)); }
  .rail .sep { display: none; }
  .rail .group { flex-wrap: wrap; justify-content: center; }
  .seg { padding: 0 9px; letter-spacing: 0.02em; }
}
@media (prefers-reduced-motion: reduce) {
  .mark, .rail, .loader, .sw, .tog, .seg, .chip, .preset, .panel, #loader-bar { transition: none; }
}
</style>
</head>
<body>

<canvas id="scene" aria-label="工作室中的 Halcyon H9 超跑。拖动旋转，滚轮或双指缩放。"></canvas>

<header class="mark" aria-label="Halcyon H9">
  <span class="mark-brand">HALCYON</span>
  <span class="mark-model"><b>H</b>9</span>
</header>

<div class="hud" id="hud" aria-hidden="true">
  <div class="hud-top"><span class="hud-speed" id="hudSpeed">0</span><span class="hud-unit">km/h</span><span class="hud-gear" id="hudGear">–</span></div>
  <div class="hud-rpm"><i id="hudRpm"></i></div>
  <div class="hud-g">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27"/><circle cx="32" cy="32" r="13.5"/><path d="M5 32h54M32 5v54"/><circle id="hudGDot" class="dot" cx="32" cy="32" r="4.2"/></svg>
    <span><b id="hudG">0.00</b> G</span>
  </div>
  <dl class="hud-aero">
    <div><dt>下压力</dt><dd><b id="hudDown">0</b> kg</dd></div>
    <div><dt>阻力</dt><dd><b id="hudDrag">0</b> N</dd></div>
    <div><dt>前轴</dt><dd><b id="hudBal">0</b>%</dd></div>
  </dl>
</div>

<aside class="panel" id="panel" aria-label="车辆配置">
  <div class="panel-head">
    <div class="tabs" role="tablist" aria-label="配置类别">
      <button class="tab" role="tab" type="button" data-tab="style" aria-controls="pane-style">风格</button>
      <button class="tab" role="tab" type="button" data-tab="paint" aria-controls="pane-paint">漆面</button>
      <button class="tab" role="tab" type="button" data-tab="wheels" aria-controls="pane-wheels">轮毂</button>
      <button class="tab" role="tab" type="button" data-tab="kit" aria-controls="pane-kit">套件</button>
      <button class="tab" role="tab" type="button" data-tab="livery" aria-controls="pane-livery">涂装</button>
      <button class="tab" role="tab" type="button" data-tab="cabin" aria-controls="pane-cabin">内饰</button>
    </div>
    <button class="tog panel-close" type="button" data-panel-close aria-label="收起配置" title="收起">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <section class="pane" id="pane-style" data-pane="style" role="tabpanel">
      <div class="presets" id="presets" role="radiogroup" aria-label="风格预设"></div>
    </section>
    <section class="pane" id="pane-paint" data-pane="paint" role="tabpanel" hidden>
      <div class="field">
        <div class="field-head"><h3>颜色</h3><span id="paintName"></span></div>
        <div class="sw-grid" id="paints" role="radiogroup" aria-label="颜色"></div>
      </div>
      <div class="field">
        <div class="field-head"><h3>涂层</h3><span id="finishName"></span></div>
        <div class="chips" id="finishes" role="radiogroup" aria-label="涂层"></div>
      </div>
    </section>
    <section class="pane" id="pane-wheels" data-pane="wheels" role="tabpanel" hidden>
      <div class="field">
        <div class="field-head"><h3>样式</h3></div>
        <div class="chips tiles" id="wheelDesigns" role="radiogroup" aria-label="轮毂样式"></div>
      </div>
      <div class="field">
        <div class="field-head"><h3>轮毂涂层</h3><span id="rimName"></span></div>
        <div class="sw-row" id="rims" role="radiogroup" aria-label="轮毂涂层"></div>
      </div>
      <div class="field">
        <div class="field-head"><h3>卡钳</h3><span id="caliperName"></span></div>
        <div class="sw-row" id="calipers" role="radiogroup" aria-label="卡钳颜色"></div>
      </div>
    </section>
    <section class="pane" id="pane-kit" data-pane="kit" role="tabpanel" hidden>
      <div class="field">
        <div class="field-head"><h3>尾翼</h3></div>
        <div class="chips" id="wings" role="radiogroup" aria-label="尾翼"></div>
      </div>
      <div class="field">
        <div class="field-head"><h3>空力</h3></div>
        <div class="chips" id="kits" role="radiogroup" aria-label="空力套件"></div>
      </div>
    </section>
    <section class="pane" id="pane-livery" data-pane="livery" role="tabpanel" hidden>
      <div class="chips tiles" id="liveries" role="radiogroup" aria-label="涂装"></div>
    </section>
    <section class="pane" id="pane-cabin" data-pane="cabin" role="tabpanel" hidden>
      <div class="chips" id="cabins" role="radiogroup" aria-label="内饰"></div>
    </section>
  </div>
</aside>

<nav class="rail" aria-label="动态控制">
  <div class="group toggles">
    <button class="tog" type="button" data-toggle="doors" aria-label="车门" title="车门">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.5 19.5V11l5.5-6.5h9.5v15z"/><path d="M4.8 11.2h14.4M14.5 14.5h2"/></svg>
    </button>
    <button class="tog" type="button" data-toggle="wing" aria-label="尾翼" title="尾翼">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5c5-1.6 13-1.6 18 0l-1.6 2.6C14.5 9 9.5 9 4.6 10.1z"/><path d="M8.5 9.6c-.6 3 .2 6.4 1 9.4M15.5 9.6c.6 3-.2 6.4-1 9.4"/></svg>

function archTop(X, ys) {

  if (X < SC_X0 + 0.01 && X > SC_X1 - 0.03) {

function stationList() {

const BODY = {}; // filled by buildBody (keeps section data for other parts)

  const capGeo = new THREE.BufferGeometry();
  capGeo.setAttribute('position', new THREE.Float32BufferAttribute(cpos, 3));
  capGeo.setAttribute('uv', new THREE.Float32BufferAttribute(cuv, 2));
  capGeo.setIndex(cidx);
  capGeo.computeVertexNormals();
  BODY.tailRing = clean;
  return { skin, underMesh, capGeo };
}

/* =========================================================================
   CANOPY — glass bubble with painted roof, rear fairing and black A-pillars
   ========================================================================= */
const CX0 = -1.25, CX1 = 1.10, CYB = 0.60;
const CC = {
  yR: designCurve([[1.10, 0.60], [1.0, 0.665], [0.9, 0.725], [0.75, 0.80], [0.55, 0.905], [0.32, 1.005], [0.1, 1.075], [-0.1, 1.105], [-0.3, 1.10], [-0.55, 1.065], [-0.8, 1.0], [-1.0, 0.935], [-1.15, 0.875], [-1.25, 0.82]], 0.04),
  wB: designCurve([[1.10, 0.54], [0.9, 0.62], [0.6, 0.675], [0.2, 0.695], [-0.2, 0.69], [-0.5, 0.655], [-0.8, 0.57], [-1.05, 0.46], [-1.25, 0.36]], 0.05),
  n: designCurve([[1.1, 2.0], [0.6, 2.3], [-0.2, 2.5], [-0.8, 2.4], [-1.25, 2.1]], 0.05),
};
function canopyPoint(X, phi, side) {
  const yR = CC.yR(X), wB = CC.wB(X), e = 2 / CC.n(X);
  const c = Math.max(0, Math.cos(phi)), s = Math.max(0, Math.sin(phi));
  return [X, CYB + (yR - CYB) * Math.pow(s, e), wB * Math.pow(c, e) * side];
}
const PHI_RAIL = 0.87;
const XB = (phi) => -0.56 - 0.24 * Math.pow(1 - Math.sin(phi), 1.4);
const XH = (psi) => 0.08 + 0.035 * (1 - psi * psi);
const XA = (phi) => lerp(0.95, 0.065, Math.pow(clamp((phi - 0.06) / 0.86, 0, 1), 1 / 0.85)); // A-pillar centreline

function buildCanopy() {
  // windshield: everything in front of the A-pillars and below the roof header
  const xRear = (phi) => {
    const psiR = (Math.PI / 2 - phi) / (Math.PI / 2 - PHI_RAIL);
    const xh = XH(Math.min(1, psiR));
    const xa = phi <= 0.92 ? XA(phi) : 0.065;
    return Math.max(xa, xh);
  };
  const wsP = (u, v) => {
    const psi = v * 2 - 1, side = psi < 0 ? -1 : 1;
    const phi = (Math.PI / 2) * (1 - Math.abs(psi));
    return canopyPoint(lerp(xRear(phi), CX1, u), phi, side);
  };
  const glass = new THREE.Mesh(patchGeometry(64, 96, wsP, null), M.glass);
  glass.renderOrder = 2;
  car.add(glass);
  REFL_HIDE.push(glass);
  BODY.glass = glass;
  // side windows travel with the doors (parented in buildDoors)
  BODY.doorGlass = {};
  for (const side of [-1, 1]) {
    const dgP = (u, v) => { const phi = lerp(0.20, PHI_RAIL, u); return canopyPoint(lerp(XB(phi), XA(phi), v), phi, side); };
    const g = new THREE.Mesh(patchGeometry(28, 64, dgP, null, { flip: side < 0 }), M.glass);
    g.renderOrder = 2;
    BODY.doorGlass[side] = g;
    REFL_HIDE.push(g);
  }

  const OFF = 0.0032;
  const taper = (d) => 0.35 + 0.65 * sstep(0.0, 0.014, d);
  // roof + rear fairing (painted)
  const roofP = (u, v) => {
    const psi = v * 2 - 1, side = psi < 0 ? -1 : 1;
    const X = lerp(CX0, XH(psi), u);
    const phi = Math.PI / 2 - Math.abs(psi) * (Math.PI / 2 - PHI_RAIL);
    return canopyPoint(X, phi, side);
  };
  const xbRail = XB(PHI_RAIL);
  const roofOff = (u, v) => {
    const psi = v * 2 - 1;
    const X = lerp(CX0, XH(psi), u);
    const dFront = XH(psi) - X;
    const sideOpen = sstep(xbRail - 0.02, xbRail + 0.02, X);
    const dSide = lerp(1, (1 - Math.abs(psi)) * 0.42, sideOpen);
    return OFF * taper(Math.min(dFront, dSide));
  };
  const roof = new THREE.Mesh(patchGeometry(90, 60, roofP, roofOff, { flip: false }), M.paint);
  car.add(roof);
  BODY.roof = roof;
  for (const side of [-1, 1]) {
    const qP = (u, v) => {
      const phi = u * PHI_RAIL;
      const X = lerp(CX0, XB(phi), v);
      return canopyPoint(X, phi, side);
    };
    const qOff = (u, v) => { const phi = u * PHI_RAIL; const X = lerp(CX0, XB(phi), v); return OFF * taper(XB(phi) - X); };
    const q = new THREE.Mesh(patchGeometry(40, 70, qP, qOff, { flip: side < 0 }), M.paint);
    car.add(q);
    BODY['quarter' + side] = q;
  }
  // A-pillars
  for (const side of [-1, 1]) {
    const N = 48, across = [-1, -0.82, 0, 0.82, 1], offs = [0.0004, 0.0032, 0.0045, 0.0032, 0.0004];
    const rowsA = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const X = lerp(0.95, 0.065, t), phi = lerp(0.06, 0.92, Math.pow(t, 0.85));
      const p = canopyPoint(X, phi, side);
      const p2 = canopyPoint(X - 0.002, lerp(0.06, 0.92, Math.pow(Math.min(1, t + 0.002), 0.85)), side);
      const pa = canopyPoint(X, phi + 0.002, side), pb = canopyPoint(X + 0.002, phi, side);
      const T = new V3(p2[0] - p[0], p2[1] - p[1], p2[2] - p[2]).normalize();
      const Nn = new V3().crossVectors(new V3(pa[0] - p[0], pa[1] - p[1], pa[2] - p[2]), new V3(pb[0] - p[0], pb[1] - p[1], pb[2] - p[2])).normalize();
      if (Nn.y < 0 && Math.abs(Nn.z) < 0.5) Nn.negate();
      if (Math.sign(Nn.z) !== side && Math.abs(Nn.z) > 0.2) Nn.negate();
      const Bv = new V3().crossVectors(Nn, T).normalize();
      const w = 0.028;
      const row = across.map((s, k) => [p[0] + Bv.x * s * w + Nn.x * offs[k], p[1] + Bv.y * s * w + Nn.y * offs[k], p[2] + Bv.z * s * w + Nn.z * offs[k]]);
      rowsA.push(side > 0 ? row : row.slice().reverse());
    }
    const g = gridGeometry(rowsA);
    // ensure outward normals
    const nrm = g.attributes.normal; let sz = 0;
    for (let k = 0; k < nrm.count; k++) sz += nrm.getZ(k);
    if (Math.sign(sz) !== side) { const idx = g.index.array; for (let k = 0; k < idx.length; k += 3) { const tmp = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = tmp; } g.computeVertexNormals(); }
    car.add(new THREE.Mesh(g, M.pillar || (M.pillar = Object.assign(M.blackGloss.clone(), { side: THREE.DoubleSide }))));
  }
}

/* =========================================================================
   DOORS — cut from the lofted skin along four planes, hinged butterfly-style
   ========================================================================= */
const DOOR = { X0: 0.93, Y0: 0.325, R0x: -0.06, R0y: 0.325, Z0: 0.585, T: 0.045 };
const DN3 = [0.7336, 0.6795];               // normal of the slanted rear cut
const HINGE = { x: 0.90, y: 0.72, z: 0.84, ax: [-0.40, 0.86, -0.32], angle: 1.12 };
const DOORS = {};
const doorF = (side) => [
  (p) => DOOR.X0 - p[0],
  (p) => p[1] - DOOR.Y0,
  (p) => (p[0] - DOOR.R0x) * DN3[0] + (p[1] - DOOR.R0y) * DN3[1],
  (p) => p[2] * side - DOOR.Z0,
];

function vlerp(A, B, t) {
  return {
    p: [A.p[0] + (B.p[0] - A.p[0]) * t, A.p[1] + (B.p[1] - A.p[1]) * t, A.p[2] + (B.p[2] - A.p[2]) * t],
    n: [A.n[0] + (B.n[0] - A.n[0]) * t, A.n[1] + (B.n[1] - A.n[1]) * t, A.n[2] + (B.n[2] - A.n[2]) * t],
    u: [A.u[0] + (B.u[0] - A.u[0]) * t, A.u[1] + (B.u[1] - A.u[1]) * t], i: -1,
  };
}
// keep = 1 keeps f >= 0, keep = -1 keeps f <= 0
function clipBy(poly, f, keep) {
  const out = [];
  for (let k = 0; k < poly.length; k++) {
    const A = poly[k], B = poly[(k + 1) % poly.length];
    const fa = f(A.p) * keep, fb = f(B.p) * keep;
    if (fa >= 0) out.push(A);
    if ((fa >= 0) !== (fb >= 0)) out.push(vlerp(A, B, fa / (fa - fb)));
  }
  return out;
}

// Weld a triangle soup by position and return its open (boundary) edges
function boundaryEdges(P, N) {
  const map = new Map(), verts = [], tri = [];
  for (let i = 0; i < P.length / 3; i++) {
    const key = Math.round(P[i * 3] * 2e4) + '|' + Math.round(P[i * 3 + 1] * 2e4) + '|' + Math.round(P[i * 3 + 2] * 2e4);
    let id = map.get(key);
    if (id === undefined) { id = verts.length; map.set(key, id); verts.push({ p: [P[i * 3], P[i * 3 + 1], P[i * 3 + 2]], n: [N[i * 3], N[i * 3 + 1], N[i * 3 + 2]] }); }
    tri.push(id);
  }
  const em = new Map();
  for (let t = 0; t < tri.length; t += 3) for (let e = 0; e < 3; e++) {
    const a = tri[t + e], b = tri[t + (e + 1) % 3];
    if (a === b) continue;
    const k = a < b ? a * 1e7 + b : b * 1e7 + a;
    const r = em.get(k);
    if (r) r.c++; else em.set(k, { a, b, c: 1 });
  }
  const edges = [];
  for (const r of em.values()) if (r.c === 1) edges.push(r);
  return { verts, edges };
}

function splitDoors() {
  const geo = BODY.skin.geometry;
  const pos = geo.attributes.position.array, nrm = geo.attributes.normal.array, uva = geo.attributes.uv.array;
  const idx = geo.index.array;
  const P = Array.from(pos), N = Array.from(nrm), U = Array.from(uva);
  const paint = [], inner = [];
  const door = { 1: { P: [], N: [], U: [] }, [-1]: { P: [], N: [], U: [] } };
  const V = (i) => ({ p: [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]], n: [nrm[i * 3], nrm[i * 3 + 1], nrm[i * 3 + 2]], u: [uva[i * 2], uva[i * 2 + 1]], i });
  const addV = (v) => {
    if (v.i >= 0) return v.i;
    const id = P.length / 3, l = Math.hypot(v.n[0], v.n[1], v.n[2]) || 1;
    P.push(v.p[0], v.p[1], v.p[2]); N.push(v.n[0] / l, v.n[1] / l, v.n[2] / l); U.push(v.u[0], v.u[1]);
    v.i = id; return id;
  };
  const emitBody = (poly, list) => { const ids = poly.map(addV); for (let k = 1; k < ids.length - 1; k++) list.push(ids[0], ids[k], ids[k + 1]); };
  const emitDoor = (side, poly) => {
    const D = door[side];
    for (let k = 1; k < poly.length - 1; k++) for (const v of [poly[0], poly[k], poly[k + 1]]) {
      const l = Math.hypot(v.n[0], v.n[1], v.n[2]) || 1;
      D.P.push(v.p[0], v.p[1], v.p[2]); D.N.push(v.n[0] / l, v.n[1] / l, v.n[2] / l); D.U.push(v.u[0], v.u[1]);
    }
  };
  const fr = (x, y) => (x - DOOR.R0x) * DN3[0] + (y - DOOR.R0y) * DN3[1];
  for (const g of geo.groups) {
    for (let t = g.start; t < g.start + g.count; t += 3) {
      const a = idx[t], b = idx[t + 1], c = idx[t + 2];
      const keep = g.materialIndex === 0 ? paint : inner;
      const xa = pos[a * 3], xb = pos[b * 3], xc = pos[c * 3];
      const ya = pos[a * 3 + 1], yb = pos[b * 3 + 1], yc = pos[c * 3 + 1];
      const za = pos[a * 3 + 2], zb = pos[b * 3 + 2], zc = pos[c * 3 + 2];
      const side = za + zb + zc >= 0 ? 1 : -1;
      if ((xa > DOOR.X0 && xb > DOOR.X0 && xc > DOOR.X0) || (ya < DOOR.Y0 && yb < DOOR.Y0 && yc < DOOR.Y0) ||
          (za * side < DOOR.Z0 && zb * side < DOOR.Z0 && zc * side < DOOR.Z0) || (fr(xa, ya) < 0 && fr(xb, yb) < 0 && fr(xc, yc) < 0)) {
        keep.push(a, b, c); continue;
      }
      let poly = [V(a), V(b), V(c)];
      for (const f of doorF(side)) {
        if (poly.every((v) => f(v.p) >= 0)) continue;
        const o = clipBy(poly, f, -1);
        if (o.length >= 3) emitBody(o, keep);
        poly = clipBy(poly, f, 1);
        if (poly.length < 3) break;
      }
      if (poly.length >= 3) emitDoor(side, poly);
    }
  }
  const ng = new THREE.BufferGeometry();
  ng.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  ng.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  ng.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  ng.setIndex(paint.concat(inner));
  ng.addGroup(0, paint.length, 0);
  ng.addGroup(paint.length, inner.length, 1);
  geo.dispose();
  BODY.skin.geometry = ng;
  return door;
}

function soupGeometry(P, N, U) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  if (N) g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  if (U) g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  if (!N) g.computeVertexNormals();
  return g;
}

function buildDoors() {
  const parts = splitDoors();
  const T = DOOR.T;
  for (const side of [-1, 1]) {
    const D = parts[side];
    const skin = new THREE.Mesh(soupGeometry(D.P, D.N, D.U), M.paint);
    // inner door card: the skin pushed inward, winding reversed
    const ip = [], inn = [];
    for (let i = 0; i < D.P.length; i += 9) for (const k of [0, 2, 1]) {
      const o = i + k * 3;
      ip.push(D.P[o] - D.N[o] * T, D.P[o + 1] - D.N[o + 1] * T, D.P[o + 2] - D.N[o + 2] * T);
      inn.push(-D.N[o], -D.N[o + 1], -D.N[o + 2]);
    }
    const card = new THREE.Mesh(soupGeometry(ip, inn), M.doorCard);
    // carbon edge band closing skin and card
    const { verts, edges } = boundaryEdges(D.P, D.N);
    const bp = [], bu = [];
    for (const e of edges) {
      const A = verts[e.a], B = verts[e.b];
      const A2 = [A.p[0] - A.n[0] * T, A.p[1] - A.n[1] * T, A.p[2] - A.n[2] * T];
      const B2 = [B.p[0] - B.n[0] * T, B.p[1] - B.n[1] * T, B.p[2] - B.n[2] * T];
      bp.push(...A.p, ...B.p, ...B2, ...A.p, ...B2, ...A2);
      for (const q of [A.p, B.p, B2, A.p, B2, A2]) bu.push(q[0] + q[2], q[1]);
    }
    const band = new THREE.Mesh(soupGeometry(bp, null, bu), M.jamb);
    const pivot = new THREE.Group();
    const H = new V3(HINGE.x, HINGE.y, HINGE.z * side);
    pivot.position.copy(H);
    const content = new THREE.Group();
    content.position.copy(H).negate();
    content.add(skin, card, band);
    if (BODY.doorGlass && BODY.doorGlass[side]) content.add(BODY.doorGlass[side]);
    pivot.add(content);
    car.add(pivot);
    const axis = new V3(HINGE.ax[0], HINGE.ax[1], HINGE.ax[2] * side).normalize();
    DOORS[side] = { pivot, content, skin, card, axis, angle: HINGE.angle * side };
  }
  buildJambs();
  car.updateMatrixWorld(true);
}

// Carbon aperture around the opening, so an open door shows a finished frame and sill
function buildJambs() {
  const geo = BODY.skin.geometry;
  const pos = geo.attributes.position.array, nrm = geo.attributes.normal.array, idx = geo.index.array;
  const P = [], N = [];
  for (let t = 0; t < idx.length; t += 3) {
    let near = true;
    for (let k = 0; k < 3; k++) {
      const i = idx[t + k], x = pos[i * 3], y = pos[i * 3 + 1], z = Math.abs(pos[i * 3 + 2]);
      if (x < -0.75 || x > 0.97 || y < 0.29 || z < 0.55) { near = false; break; }
    }
    if (!near) continue;
    for (let k = 0; k < 3; k++) { const i = idx[t + k]; P.push(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]); N.push(nrm[i * 3], nrm[i * 3 + 1], nrm[i * 3 + 2]); }
  }
  const { verts, edges } = boundaryEdges(P, N);
  const onPlane = (v, k) => Math.abs(doorF(v.p[2] >= 0 ? 1 : -1)[k](v.p)) < 3e-5;
  const target = (v, k) => {
    if (k === 3) return [v.p[0], v.p[1] - 0.05, v.p[2]];
    const side = v.p[2] >= 0 ? 1 : -1;
    const s = sstep(0.35, 0.7, Math.abs(v.n[2]));
    const down = [v.p[0] - v.n[0] * 0.05, v.p[1] - v.n[1] * 0.05, v.p[2] - v.n[2] * 0.05];
    return [lerp(down[0], v.p[0], s), lerp(down[1], v.p[1], s), lerp(down[2], side * 0.60, s)];
  };
  const bp = [], bu = [];
  for (const e of edges) {
    const A = verts[e.a], B = verts[e.b];
    let plane = -1;
    for (let k = 0; k < 4 && plane < 0; k++) if (onPlane(A, k) && onPlane(B, k)) plane = k;
    if (plane < 0) continue;
    const A2 = target(A, plane), B2 = target(B, plane);
    bp.push(...A.p, ...B.p, ...B2, ...A.p, ...B2, ...A2);
    for (const q of [A.p, B.p, B2, A.p, B2, A2]) bu.push(q[0] + q[2], q[1]);
  }
  if (bp.length) car.add(new THREE.Mesh(soupGeometry(bp, null, bu), M.jamb));
}

/* =========================================================================
   WHEELS
   ========================================================================= */
function makeTireProfile(R, hw, rimR) {
  const sw = R - rimR, gw = 0.0115, gd = 0.0075;
  const outer = [
    [rimR + 0.004, hw * 0.80], [rimR + 0.012, hw * 0.865], [rimR + sw * 0.22, hw * 0.94],
    [rimR + sw * 0.42, hw * 0.985], [rimR + sw * 0.6, hw * 1.0], [rimR + sw * 0.78, hw * 0.985],
    [R - 0.02, hw * 0.955], [R - 0.009, hw * 0.93], [R - 0.0025, hw * 0.895], [R, hw * 0.86],
  ];
  const tread = [];
  const grooves = [0.62, 0.22];
  let w = hw * 0.86;
  for (const g of grooves) {
    const gc = g * hw;
    tread.push([R, gc + gw / 2], [R - gd, gc + gw / 2 - 0.0012], [R - gd, gc - gw / 2 + 0.0012], [R, gc - gw / 2]);
  }
  tread.push([R, 0.0]);
  const half = outer.concat(tread); // from outer bead to centre (w decreasing)
  const full = half.map(p => [p[0], -p[1]]).concat(half.slice(0, -1).reverse()); // inner bead -> outer bead (w increasing)
  return full;
}

function tireTextTexture(text1, text2) {
  return canvasTex(4096, 256, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    for (const off of [0, w / 2]) {
      ctx.fillStyle = 'rgba(238,238,232,1)';
      setFont(ctx, 800, 128, 'expanded');
      ctx.fillText(text1, off + 620, h * 0.54);
      ctx.fillStyle = 'rgba(200,200,196,1)';
      setFont(ctx, 600, 58, 'normal');
      ctx.fillText(text2, off + 1560, h * 0.54);
    }
  });
}

function discTexture() {
  return canvasTex(1024, 1024, (ctx, w) => {
    const c = w / 2;
    const g = ctx.createRadialGradient(c, c, c * 0.55, c, c, c);
    g.addColorStop(0, '#5a5654'); g.addColorStop(0.5, '#4a4644'); g.addColorStop(1, '#3d3a39');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
    // carbon-ceramic speckle
    for (let i = 0; i < 9000; i++) {
      const a = rand() * Math.PI * 2, r = c * (0.6 + rand() * 0.4);
      ctx.fillStyle = `rgba(${rand() < 0.5 ? '20,20,20' : '120,115,110'},${0.15 + rand() * 0.2})`;
      ctx.fillRect(c + Math.cos(a) * r, c + Math.sin(a) * r, 2, 2);
    }
    // spiral drilled holes
    const rows = 3, per = 36;
    for (let k = 0; k < per; k++) for (let j = 0; j < rows; j++) {
      const a = (k / per) * Math.PI * 2 + j * 0.055;
      const r = c * (0.70 + j * 0.095);
      ctx.fillStyle = '#0b0b0b';
      ctx.beginPath(); ctx.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(140,135,130,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    }
    // pad wear ring
    ctx.strokeStyle = 'rgba(160,155,150,0.10)'; ctx.lineWidth = c * 0.33;
    ctx.beginPath(); ctx.arc(c, c, c * 0.79, 0, Math.PI * 2); ctx.stroke();
  });
}

function caliperLogoTexture(text) {
  return canvasTex(512, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'italic 800 84px "Archivo", "Arial Black", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2 + 4);

/* =========================================================================
   AERO, MIRRORS, EXHAUSTS, LIGHTS, INTERIOR
   ========================================================================= */
function lipZ(X) { const s = sectionAt(X); return s.lipSkin[0][0]; }

function buildAero() {
  BODY.track = [];
  // ---- front splitter (follows the nose outline) ----
  const pts = [];
  const xsN = [];
  for (let X = 1.84; X <= XF - 0.004; X += 0.02) xsN.push(X);
  for (let X = XF - 0.004; X < XF; X += 0.001) xsN.push(X);
  for (const X of xsN) { const zl = lipZ(X); pts.push([X + 0.05 * sstep(1.95, 2.35, X), zl + 0.028]); }
  pts.push([XF + 0.055, 0]);
  const outline = [];
  pts.forEach(p => outline.push([p[0], -p[1]]));
  for (let i = pts.length - 1; i >= 0; i--) outline.push([pts[i][0], pts[i][1]]);
  const shp = new THREE.Shape(outline.map(p => new THREE.Vector2(p[0], p[1])));
  const sg = new THREE.ExtrudeGeometry(shp, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.003, bevelSegments: 2, curveSegments: 8 });
  sg.rotateX(-Math.PI / 2);
  sg.translate(0, 0.068, 0);
  // rotateX(-90) maps shape y -> -z; our outline y is +/-z already symmetric, fine
  car.add(new THREE.Mesh(sg, M.carbon));
  // splitter vertical fences
  for (const side of [-1, 1]) {
    const zl = lipZ(1.9) + 0.02;
    const fg = extrudeXY([[1.86, 0.07], [2.08, 0.07], [2.02, 0.16], [1.88, 0.18]], 0.008, 0);
    fg.translate(0, 0, side * zl);
    const fm = new THREE.Mesh(fg, M.carbon);
    car.add(fm);
    BODY.track.push(fm);
  }

  // ---- front canards (dive planes) ----
  for (const side of [-1, 1]) {
    for (const [cy0, cx0, len, wid] of [[0.215, 2.06, 0.17, 0.075], [0.29, 2.02, 0.13, 0.06]]) {
      const hit = hitBody(new V3(cx0, cy0, side * 2), new V3(0, 0, -side));
      if (!hit) continue;
      const zb = Math.abs(hit.point.z) - 0.02;
      const plan = [[cx0 + len * 0.5, zb], [cx0 - len * 0.5, zb], [cx0 - len * 0.32, zb + wid], [cx0 + len * 0.18, zb + wid * 0.92]];
      const shp = new THREE.Shape(plan.map(p => new THREE.Vector2(p[0], -p[1])));
      const g = new THREE.ExtrudeGeometry(shp, { depth: 0.006, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.0015, bevelSegments: 1 });
      g.rotateX(-Math.PI / 2);
      if (side < 0) g.scale(1, 1, -1);
      const m = new THREE.Mesh(g, M.carbon);
      m.position.y = cy0;
      m.rotation.z = -0.16;
      m.position.x = cx0 * (1 - Math.cos(0.16)) - cy0 * Math.sin(0.16) * 0.0;
      car.add(m);
      BODY.track.push(m);
    }
  }

  // ---- side skirts ----
  for (const side of [-1, 1]) {
    const rings = [];
    const x0 = 0.94, x1 = -0.84;
    for (let i = 0; i <= 70; i++) {
      const X = lerp(x0, x1, i / 70);
      const zl = lipZ(X);
      const taper = sstep(0, 0.12, (x0 - X)) * sstep(0, 0.12, X - x1);
      const out = 0.045 * (0.25 + 0.75 * taper);
      const prof = [[zl - 0.035, 0.064], [zl + out, 0.064], [zl + out + 0.006, 0.072], [zl + out * 0.3, 0.128], [zl - 0.035, 0.14]];
      rings.push(prof.map(([z, y]) => [X, y, side * z]));
    }
    car.add(new THREE.Mesh(loftClosed(side > 0 ? rings : rings.map(r => r.slice().reverse())), M.carbon));
  }

  // ---- rear diffuser strakes ----
  for (const z0 of [0, -0.21, 0.21, -0.42, 0.42]) {
    const top = [];
    for (let X = XR - 0.025; X <= -1.48; X += 0.04) top.push([X, BC.yf(X) + 0.01]);
    const poly = [[-1.48, 0.088], [XR - 0.025, 0.088]].concat(top);
    car.add(new THREE.Mesh(extrudeXY(poly, 0.008, z0), M.carbon));
  }

  // ---- rear wing on swan-neck pylons ----
  const wing = new THREE.Group();
  const chord = 0.33, span = 1.84, xLE = -1.83, yLE = 1.115, aoa = 0.13;
  const foil = [];
  const m = 0.065, pp = 0.42, t = 0.13, NP = 40;
  const upper = [], lower = [];
  for (let i = 0; i <= NP; i++) {
    const x = 0.5 - 0.5 * Math.cos(Math.PI * i / NP);
    const yt = 5 * t * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4);
    const yc = x < pp ? m / (pp * pp) * (2 * pp * x - x * x) : m / ((1 - pp) ** 2) * ((1 - 2 * pp) + 2 * pp * x - x * x);
    const dyc = x < pp ? 2 * m / (pp * pp) * (pp - x) : 2 * m / ((1 - pp) ** 2) * (pp - x);
    const th = Math.atan(dyc);
    upper.push([x - yt * Math.sin(th), yc + yt * Math.cos(th)]);
    lower.push([x + yt * Math.sin(th), yc - yt * Math.cos(th)]);
  }
  const toWorld = ([x, y]) => {
    const X = -x * chord, Y = -y * chord; // inverted camber
    const b = -aoa;
    return [xLE + X * Math.cos(b) - Y * Math.sin(b), yLE + X * Math.sin(b) + Y * Math.cos(b)];
  };
  for (let i = NP; i >= 0; i--) foil.push(toWorld(upper[i]));
  for (let i = 1; i < NP; i++) foil.push(toWorld(lower[i]));
  const wingGeo = extrudeXY(foil, span, 0);
  wing.add(new THREE.Mesh(wingGeo, M.carbon));
  const te = toWorld([1, 0]);
  const gurney = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.022, span), M.blackGloss);
  gurney.position.set(te[0] + 0.001, te[1] + 0.011, 0);
  wing.add(gurney);
  // upper flap element: angle follows deploy state and airbrake
  const fChord = 0.13, flapFoil = [];
  const fpt = ([x, y]) => [-x * fChord, -y * fChord];
  for (let i = NP; i >= 0; i--) flapFoil.push(fpt(upper[i]));
  for (let i = 1; i < NP; i++) flapFoil.push(fpt(lower[i]));
  const flapPivot = new THREE.Group();
  flapPivot.position.set(te[0] + 0.03, te[1] + 0.036, 0);
  flapPivot.add(new THREE.Mesh(extrudeXY(flapFoil, span - 0.012, 0), M.carbon));
  flapPivot.rotation.z = -0.45;
  wing.add(flapPivot);
  BODY.flap = flapPivot;
  BODY.wingFoil = foil.map((p) => p.slice());
  BODY.flapFoil = flapFoil.map((p) => p.slice());
  BODY.flapPivotPos = [te[0] + 0.03, te[1] + 0.036];
  // end plates
  for (const side of [-1, 1]) {
    const ep = extrudeXY([[-1.79, 1.05], [-2.20, 1.03], [-2.27, 1.10], [-2.27, 1.27], [-2.16, 1.315], [-1.88, 1.20], [-1.785, 1.11]], 0.009, side * (span / 2 + 0.0045), { bevel: 0.002 });
    wing.add(new THREE.Mesh(ep, M.carbon));
  }
  // swan-neck pylons
  const bez = (t, p0, p1, p2, p3) => { const u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; };
  const P0 = [-1.66, 0.70], P1 = [-1.73, 1.06], P2 = [-1.86, 1.30], P3 = [-2.0, 1.165];
  const cl = [];
  for (let i = 0; i <= 40; i++) cl.push(bez(i / 40, P0, P1, P2, P3));
  const left = [], right = [];
  for (let i = 0; i <= 40; i++) {
    const a = cl[Math.max(0, i - 1)], b = cl[Math.min(40, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty); tx /= l; ty /= l;
    const w = lerp(0.062, 0.03, Math.pow(i / 40, 0.8));
    left.push([cl[i][0] - ty * w / 2, cl[i][1] + tx * w / 2]);
    right.push([cl[i][0] + ty * w / 2, cl[i][1] - tx * w / 2]);
  }
  const pyl = left.concat(right.reverse());
  for (const side of [-1, 1]) wing.add(new THREE.Mesh(extrudeXY(pyl, 0.016, side * 0.34, { bevel: 0.003 }), M.carbon));
  car.add(wing);
  BODY.wing = wing;
}

function buildMirrors() {
  for (const side of [-1, 1]) {
    const tgt = DOORS[side] ? DOORS[side].content : car;

}

function buildExhausts() {
  const grad = canvasTex(4, 128, (ctx, w, h) => { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#000'); g.addColorStop(0.45, '#555'); g.addColorStop(1, '#fff'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }, { srgb: false });

  for (const z of [-0.155, 0.155]) {

function tailTopY(z) {
  // top contour of the tail ring at lateral position z
  const ring = BODY.tailRing;
  let best = -1;
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length];
    if ((a[0] - z) * (b[0] - z) <= 0 && a[0] !== b[0]) {
      const t = (z - a[0]) / (b[0] - a[0]);
      best = Math.max(best, a[1] + (b[1] - a[1]) * t);
    }
  }
  return best;
}

function buildLights() {
  // ---- tail light bar on the Kamm face ----
  const zmax = Math.max(...BODY.tailRing.map(p => p[0]));
  const ptsBar = [];
  for (let i = 0; i <= 60; i++) {
    const z = lerp(-zmax * 0.94, zmax * 0.94, i / 60);
    ptsBar.push(new V3(XR - 0.004, tailTopY(z) - 0.05 - 0.035 * Math.pow(Math.abs(z) / zmax, 6), z));
  }
  const curve = new THREE.CatmullRomCurve3(ptsBar);
  M.tail = new THREE.MeshStandardMaterial({ color: 0x1a0000, emissive: 0xff0a12, emissiveIntensity: 2.2, roughness: 0.3 });
  const bar = new THREE.Mesh(new THREE.TubeGeometry(curve, 240, 0.0075, 8, false), M.tail);
  car.add(bar);
  // smoked housing strip
  const sp = [], si = [];
  ptsBar.forEach((p, i) => { sp.push(p.x + 0.001, p.y + 0.024, p.z, p.x + 0.001, p.y - 0.024, p.z); if (i) { const k = i * 2; si.push(k - 2, k, k - 1, k - 1, k, k + 1); } });
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); sg.setIndex(si); sg.computeVertexNormals();
  const strip = new THREE.Mesh(sg, new THREE.MeshPhysicalMaterial({ color: 0x0b0203, roughness: 0.1, clearcoat: 1, side: THREE.DoubleSide }));
  car.add(strip);
  // rain light in diffuser
  const rain = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.035).rotateY(-Math.PI / 2), M.tail);
  rain.position.set(XR - 0.008, 0.215, 0);
  car.add(rain);
  // rear lettering
  const lt = wordmarkTex('HALCYON', '#ffffff', 2048, 256, 170, 'ultra-expanded');
  const letters = new THREE.Mesh(new THREE.PlaneGeometry(0.64, 0.08).rotateY(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.18, alphaMap: lt, transparent: true, depthWrite: false, envMapIntensity: 2.2 }));
  letters.position.set(XR - 0.006, 0.635, 0);

  // ---- headlights (decals on the nose corners) ----

  for (const side of [-1, 1]) {
    const hit = hitBody(new V3(3.2, 0.455, side * 0.66), new V3(-1, 0, 0));
    if (!hit) continue;
    const n = hit.face.normal.clone().lerp(new V3(1, 0, side * 0.35), 0.5).normalize();
    const up = new V3(0, 1, 0);
    const mat = decalMaterial(hlMap, { emissiveMap: hlEm, emissive: new THREE.Color(0xdfeaff), emissiveIntensity: 2.5, roughness: 0.25, metalness: 0.4 });
    M.headlights = M.headlights || [];
    M.headlights.push(mat);
    const flipU = side < 0;
    const d = addDecal(BODY.skin, hit.point, n, side > 0 ? up : up, 0.46, 0.115, 0.30, mat);
    if (d && flipU) { const uv = d.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setX(i, 1 - uv.getX(i)); }
  }
}

function buildIntakesAndVents() {
  // centre nose intake

  }

// Active rear spoiler: folds flush into the tail deck, rises on two struts, tilts into an airbrake
function buildSpoiler() {
  const span = 1.50, chord = 0.24, xLE = -1.905;
  car.updateMatrixWorld(true);
  const N = 24, hs = [];
  for (let i = 0; i <= N; i++) {
    const z = lerp(-span / 2, span / 2, i / N);
    let hmax = -1;
    for (const x of [xLE - 0.01, xLE - chord * 0.5, xLE - chord + 0.01]) {
      const h = hitBody(new V3(x, 2, z), new V3(0, -1, 0));
      if (h) hmax = Math.max(hmax, h.point.y);
    }
    hs.push(hmax > 0 ? hmax : 0.84);
  }
  const hAt = (z) => { const f = clamp((z + span / 2) / span, 0, 1) * N; const i = Math.min(N - 1, Math.floor(f)); return lerp(hs[i], hs[i + 1], f - i); };
  const base = hAt(0);
  const prof = [[0.0, 0.0], [0.0, 0.006], [-0.025, 0.014], [-0.10, 0.017], [-chord + 0.01, 0.008], [-chord, 0.003], [-chord, 0.0]];
  const geo = extrudeXY(prof, span, 0, { steps: 48, bevel: 0.0015 });
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) + hAt(p.getZ(i)) - base);
  geo.computeVertexNormals();
  const group = new THREE.Group();
  group.position.set(xLE, base + 0.004, 0);
  group.add(new THREE.Mesh(geo, M.carbon));
  car.add(group);
  const struts = [];
  for (const z of [-0.42, 0.42]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1, 0.012), M.carbon);
    st.position.set(xLE - 0.085, base, z);
    st.scale.y = 0.001;
    car.add(st);
    struts.push(st);
  }
  BODY.spoiler = { group, struts, deckY: base, baseY: base + 0.004, prof, xLE, hAt };
}

// geometry batches: one merged mesh per material keeps the draw-call count low
function cockpitBatch() {
  const groups = new Map();
  return {
    add(mat, geo, m4) {
      let g = geo.index ? geo.toNonIndexed() : geo.clone();
      if (m4) g.applyMatrix4(m4);
      for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv' && k !== 'color') g.deleteAttribute(k);
      if (!g.attributes.normal) g.computeVertexNormals();
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(n * 2), 2));
      if (mat.vertexColors) { if (!g.attributes.color) g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(n * 3).fill(1), 3)); }
      else if (g.attributes.color) g.deleteAttribute('color');
      g.clearGroups(); g.morphAttributes = {};
      if (!groups.has(mat)) groups.set(mat, []);
      groups.get(mat).push(g);
    },
    build(parent) {
      const out = [];
      for (const [mat, list] of groups) { const m = new THREE.Mesh(mergeGeometries(list, false), mat); parent.add(m); out.push(m); }
      groups.clear();
      return out;
    },
  };
}
const tinted = (geo, hex) => {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));

};
// matrix from a basis (X across, Y up, Z facing) and an origin
const basisAt = (o, X, Y, Z) => new THREE.Matrix4().makeBasis(X, Y, Z).setPosition(o);
function roundedShape(pts, r) {
  const s = new THREE.Shape();
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const ra = Math.min(r, da * 0.45), rb = Math.min(r, db * 0.45);
    const p0 = [p[0] + (a[0] - p[0]) / da * ra, p[1] + (a[1] - p[1]) / da * ra];
    const p1 = [p[0] + (b[0] - p[0]) / db * rb, p[1] + (b[1] - p[1]) / db * rb];
    if (i === 0) s.moveTo(p0[0], p0[1]); else s.lineTo(p0[0], p0[1]);
    s.quadraticCurveTo(p[0], p[1], p1[0], p1[1]);
  }
  s.closePath();
  return s;
}

/* ---------- textures ---------- */
// R: leather shade (quilting valleys, perforations)  G: stitch thread. u spans the seat, v repeats every 0.12 m
function quiltTextures() {
  const W = 512, H = 256;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  const hgt = new Float32Array(W * H);
  const u0 = 0.29, u1 = 0.71, cols = 4;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = (x + 0.5) / W, v = (y + 0.5) / H;
    let shade = 1, stitch = 0, h = 0.5 + (rand() - 0.5) * 0.05;
    for (const us of [u0 - 0.014, u1 + 0.014]) {
      const d = (u - us) * W;
      h -= 0.55 * Math.exp(-d * d / 5);
      shade -= 0.12 * Math.exp(-d * d / 4);
      for (const off of [-5.5, 5.5]) if (Math.abs(d - off) < 1.25 && (y % 7) < 4) stitch = 1;
    }
    if (u > u0 && u < u1) {
      const a = (u - u0) / (u1 - u0) * cols, b = v * 2;
      const p = a + b, q = a - b;
      const dp = Math.abs(p - Math.round(p)), dq = Math.abs(q - Math.round(q));
      const dE = Math.min(dp, dq);
      h += Math.min(1, dE * 4.2) * 0.9 - 0.45;
      shade *= 0.74 + 0.26 * Math.min(1, dE * 7);
      const along = dp < dq ? q : p;
      if (dE < 0.016 && ((along * 14) % 1 + 1) % 1 < 0.56) stitch = 1;
      // perforation grid inside each pillow
      const hx = (x % 7) - 3, hy = (y % 9) - 4;
      if (dE > 0.15 && hx * hx + hy * hy < 2.2) { shade *= 0.55; h -= 0.18; }
    }
    hgt[y * W + x] = h;
    const i = (y * W + x) * 4;
    img.data[i] = clamp(shade, 0, 1) * 255; img.data[i + 1] = stitch * 255; img.data[i + 2] = 0; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.NoColorSpace; map.wrapS = THREE.ClampToEdgeWrapping; map.wrapT = THREE.RepeatWrapping; map.anisotropy = 8;
  const nrm = heightToNormal(hgt, W, H, 1.6);
  nrm.wrapS = THREE.ClampToEdgeWrapping;
  map.repeat.set(1, 1 / 0.12); nrm.repeat.set(1, 1 / 0.12);
  return { map, nrm };
}
function grainNormal() {
  const S = 128, h = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) h[i] = rand();
  for (let pass = 0; pass < 2; pass++) for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    h[y * S + x] = (h[y * S + x] * 2 + h[y * S + ((x + 1) % S)] + h[((y + 1) % S) * S + x]) / 4;
  }
  const t = heightToNormal(h, S, S, 1.4);
  t.repeat.set(26, 26);
  return t;
}
function holesAlpha(cols, rows) {
  return canvasTex(128, 160, (ctx, w, h) => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#000';
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      ctx.beginPath(); ctx.arc((i + 0.5) / cols * w, (j + 0.5) / rows * h, Math.min(w / cols, h / rows) * 0.27, 0, Math.PI * 2); ctx.fill();
    }
  }, { srgb: false });
}
function monogramTex() {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
    ctx.lineWidth = 9; ctx.setLineDash([14, 7]);
    ctx.beginPath(); ctx.arc(128, 128, 104, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    setFont(ctx, 800, 150, 'normal', 'italic'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('H', 128, 136);
  }, { srgb: false });
}
function badgeTex(text, size = 120) {
  return canvasTex(512, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#fff'; setFont(ctx, 800, size * 0.62, 'expanded', 'italic');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2 + 4);
  }, { srgb: false });
}
function centreScreenTex() {
  return canvasTex(384, 384, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0a0e16'); g.addColorStop(1, '#04060a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#7f8b99'; setFont(ctx, 600, 17, 'expanded'); ctx.textAlign = 'left'; ctx.fillText('TRACK', 22, 34);
    ctx.textAlign = 'right'; ctx.fillText('21:40', w - 22, 34);
    // top-down car outline
    ctx.save(); ctx.translate(w / 2, h / 2 + 10);
    ctx.strokeStyle = '#cfd6df'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -120); ctx.bezierCurveTo(46, -118, 52, -70, 50, -30); ctx.lineTo(54, 60); ctx.bezierCurveTo(56, 104, 40, 118, 0, 120); ctx.bezierCurveTo(-40, 118, -56, 104, -54, 60); ctx.lineTo(-50, -30); ctx.bezierCurveTo(-52, -70, -46, -118, 0, -120); ctx.stroke();
    ctx.fillStyle = 'rgba(207,214,223,0.18)'; ctx.beginPath(); ctx.ellipse(0, -10, 26, 52, 0, 0, Math.PI * 2); ctx.fill();
    const tyres = [[-1, -1, '2.1', '84°'], [1, -1, '2.1', '86°'], [-1, 1, '1.9', '91°'], [1, 1, '1.9', '93°']];
    for (const [sx, sy, p, t] of tyres) {
      ctx.fillStyle = '#2fd17a'; ctx.fillRect(sx * 62 - (sx < 0 ? 12 : 0), sy * 64 - 22, 12, 44);
      ctx.textAlign = sx < 0 ? 'right' : 'left';
      ctx.fillStyle = '#e8eef6'; setFont(ctx, 700, 22, 'normal'); ctx.fillText(p, sx * 92, sy * 64 - 2);
      ctx.fillStyle = '#7f8b99'; setFont(ctx, 600, 15, 'normal'); ctx.fillText(t, sx * 92, sy * 64 + 18);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(0, h - 64, w, 64);
    ctx.fillStyle = '#cfd6df'; setFont(ctx, 600, 18, 'normal'); ctx.textAlign = 'center';
    ['21.5°', 'AUTO', 'ESC', '21.5°'].forEach((s, i) => ctx.fillText(s, (i + 0.5) * w / 4, h - 26));
  });
}

const SEAT = (() => {

    batch.add(CAB.parts, tinted(new THREE.CylinderGeometry(0.016, 0.016, 0.006, 28).rotateX(Math.PI / 2).translate(0, 0, 0.009), '#b3121f'), mb);

function buildSteeringWheel(parent) {
  const C = new V3(0.268, 0.668, -SEAT_Z);

  const Y = new V3(-Z.y, Z.x, 0).multiplyScalar(Z.x < 0 ? -1 : 1).normalize();
  if (Y.y < 0) Y.negate();
  const X = new V3().crossVectors(Y, Z).normalize();
  const mount = new THREE.Group();
  mount.matrixAutoUpdate = false;
  mount.matrix.copy(basisAt(C, X, Y, Z));
  parent.add(mount);
  const spin = new THREE.Group();
  mount.add(spin);
  const fixed = cockpitBatch(), rot = cockpitBatch();
  // D-shaped rim with thicker grips; carbon sleeves top and bottom, accent band at twelve o'clock
  const key = [[0.168, 0], [0.146, 0.084], [0.085, 0.146], [0, 0.168], [-0.085, 0.146], [-0.146, 0.084], [-0.168, 0], [-0.158, -0.066], [-0.12, -0.112], [-0.055, -0.128], [0.055, -0.128], [0.12, -0.112], [0.158, -0.066]];
  const rimCurve = new THREE.CatmullRomCurve3(key.map(([x, y]) => new V3(x, y, 0)), true, 'centripetal');
  const SEG = 220;
  const rimTube = (from, to, rad) => {
    const pts = [];
    for (let k = 0; k <= 48; k++) pts.push(rimCurve.getPointAt(((from + (to - from) * k / 48) % 1 + 1) % 1));
    const curve = new THREE.CatmullRomCurve3(pts, false);
    const nseg = Math.max(8, Math.round(SEG * (to - from)));
    const g = new THREE.TubeGeometry(curve, nseg, 1, 14, false);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const ring = Math.floor(i / 15), s = ring / nseg;
      const c = curve.getPointAt(clamp(s, 0, 1));
      const ang = Math.atan2(c.y, c.x);
      const r = typeof rad === 'function' ? rad(ang) : rad;
      p.setXYZ(i, c.x + (p.getX(i) - c.x) * r, c.y + (p.getY(i) - c.y) * r, c.z + (p.getZ(i) - c.z) * r);

  rot.add(CAB.carbon, new RoundedBoxGeometry(0.042, 0.075, 0.018, 2, 0.006).translate(0, -0.098, -0.002));
  rot.add(CAB.dark, new THREE.CylinderGeometry(0.04, 0.046, 0.05, 32).rotateX(Math.PI / 2).translate(0, -0.004, -0.04));
  // display bezel + screen

  // rotary dials, buttons, thumb rockers
  for (const [x, col] of [[-0.088, '#c8102e'], [0.088, '#e0a400']]) {

  // shift lights: brightness follows rpm through a uniform
  const ledG = [], cols = ['#2fe36a', '#2fe36a', '#2fe36a', '#2fe36a', '#ffd21f', '#ffd21f', '#ffd21f', '#ff2a3c', '#ff2a3c', '#ff2a3c', '#3a7bff'];
  cols.forEach((c, k) => {

function drawCluster() {

  const gx = clamp(d.latG / 2, -1, 1) * 62, gy = clamp(-d.lonG / 2, -1, 1) * 62;

  ctx.fillStyle = '#7f8b99'; setFont(ctx, 600, 18, 'normal'); ctx.textAlign = 'left';

    interior.add(cs);
    const A2 = new V3(0.43, 0.49, 0), B2 = new V3(0.335, 0.428, 0);
    const t2 = B2.clone().sub(A2).normalize(), n2 = new V3(t2.y, -t2.x, 0);
    const mid2 = A2.clone().add(B2).multiplyScalar(0.5).addScaledVector(n2, 0.009);
    const m2 = basisAt(mid2, new V3(0, 0, 1), t2.clone().negate(), n2);
    B.add(CAB.dark, new RoundedBoxGeometry(0.118, 0.06, 0.004, 2, 0.002), m2);
    for (let k = 0; k < 5; k++) {

    B.add(CAB.suede, patchGeometry(70, 40, roofP, () => -0.012));

    const h1 = hitCard(0.36, 0.56);
    if (h1) {
      const n = h1.face.normal.clone().transformDirection(D.card.matrixWorld);
      if (n.z * side > 0) n.negate();

      DB.add(M.seatAccent, new RoundedBoxGeometry(0.19, 0.024, 0.012, 2, 0.005), basisAt(h1.point.clone().addScaledVector(n, 0.018), xx, yy, n));

      DB.add(CAB.dark, new RoundedBoxGeometry(0.012, 0.02, 0.026, 2, 0.004).translate(0.088, 0, -0.008), basisAt(h1.point.clone().addScaledVector(n, 0.018), xx, yy, n));
    }
    const h2 = hitCard(0.62, 0.6);
    if (h2) {
      const n = h2.face.normal.clone().transformDirection(D.card.matrixWorld);
      if (n.z * side > 0) n.negate();
      const xx = new V3(1, 0, 0).addScaledVector(n, -n.x).normalize(), yy = new V3().crossVectors(n, xx).normalize();
      DB.add(CAB.alu, new RoundedBoxGeometry(0.07, 0.016, 0.008, 2, 0.003), basisAt(h2.point.clone().addScaledVector(n, 0.006), xx, yy, n));
    }
    DB.build(D.content);
  }
  car.add(interior);
  REFL_HIDE.push(interior);
  BODY.interior = interior;
  drawCluster();
}

// called every frame: wheel angle, shift lights, live screens (throttled, only when the cabin can be seen)
function updateCockpit(t) {
  if (!CAB.spin) return false;
  CAB.spin.rotation.z = DRIVE.steer * 9.5;
  const lit = DRIVE.engine > 0 ? clamp((DRIVE.rpm - 4500) / 4300, 0, 1.0001) : 0;
  CAB.ledLit.value = lit > 0.98 ? ((t * 8) % 1 < 0.5 ? 1.01 : 0) : lit;
  const near = state.view === 'cabin' || state.view === 'driver' || camera.position.distanceTo(_cockpitC) < 4.2;
  if (!near || t - CAB.lastDraw < 0.12) return false;
  const d = DRIVE, sig = [Math.round(d.v * 3.6), Math.round(d.rpm / 60), d.gear, d.engine, d.shiftFlash > 0, d.latG.toFixed(2), d.lonG.toFixed(2)].join('|');
  if (sig === CAB.sig) return false;
  CAB.sig = sig; CAB.lastDraw = t; drawCluster();
  return true;
}

function buildStudioEnv() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.SphereGeometry(40, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = mix(vec3(0.018,0.019,0.022), vec3(0.006,0.0065,0.008), smoothstep(-0.1, 0.8, h)); c = mix(vec3(0.012,0.012,0.013), c, smoothstep(-0.05, 0.02, h)); gl_FragColor = vec4(c, 1.0); }',
  }));
  env.add(room);
  const panel = (w, h, I, pos, look, color = 0xffffff) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(I), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(look); env.add(m); return m;
  };
  // big overhead softbox, long along the car
  panel(10, 2.8, 4.2, new V3(0, 7.5, 0), new V3(0, 0, 0));
  // two thin overhead strips flanking it
  panel(11, 0.35, 9.0, new V3(0, 7.2, 2.4), new V3(0, 0, 1.2));
  panel(11, 0.35, 9.0, new V3(0, 7.2, -2.4), new V3(0, 0, -1.2));
  // tall side strips (vertical highlights on the flanks)
  for (const z of [-9, 9]) for (const x of [-4.5, 0.5, 5.5]) panel(0.9, 6, 3.2, new V3(x, 3.2, z), new V3(x * 0.6, 1.2, 0));
  // front/rear key softboxes
  panel(4, 3, 2.4, new V3(10, 3.5, 3), new V3(0, 0.6, 0));
  panel(4, 3, 1.6, new V3(-10, 3.5, -3), new V3(0, 0.6, 0));
  // warm rim accent
  panel(3, 1.2, 1.4, new V3(-6, 1.6, 8), new V3(0, 0.6, 0), 0xffd9b0);
  // horizon line ring
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(22, 22, 0.55, 96, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(0.9), side: THREE.BackSide }));
  ring.position.y = 1.9;
  env.add(ring);
  return env;
}

function buildBackdrop() {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTop: { value: new THREE.Color(0x030304) }, uHorizon: { value: new THREE.Color(0x15171b) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 uTop; uniform vec3 uHorizon; varying vec3 vP;
      void main(){ vec3 d = normalize(vP); float h = d.y;
        vec3 c = mix(uHorizon, uTop, smoothstep(0.0, 0.42, h));
        gl_FragColor = vec4(c, 1.0); }`,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(90, 48, 24), mat);
  m.renderOrder = -10;
  return m;
}

// contact shadow (rendered from below, blurred)
const SHW = 6.6, SHD = 3.4;
const shadowRT = new THREE.WebGLRenderTarget(1024, 512);
const shadowBlurRT = new THREE.WebGLRenderTarget(1024, 512);
const shadowCam = new THREE.OrthographicCamera(-SHW / 2, SHW / 2, SHD / 2, -SHD / 2, 0, 1.25);
shadowCam.rotation.x = Math.PI / 2;
const depthMat = new THREE.MeshDepthMaterial();
depthMat.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );', 'gl_FragColor = vec4( vec3( 0.0 ), pow( 1.0 - fragCoordZ, 1.6 ) * 1.0 );');
};
depthMat.side = THREE.DoubleSide;
const blurScene = new THREE.Scene();
const blurCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader); hBlur.depthTest = false;
const vBlur = new THREE.ShaderMaterial(VerticalBlurShader); vBlur.depthTest = false;
const blurQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), hBlur);
blurScene.add(blurQuad);

function renderContactShadow() {
  const hidden = [];
  scene.traverse((o) => { if (o.userData.noShadow && o.visible) { hidden.push(o); o.visible = false; } });
  const prevBg = scene.background;
  scene.background = null;
  scene.overrideMaterial = depthMat;
  const prevClear = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(shadowRT);
  renderer.clear();
  renderer.render(scene, shadowCam);
  scene.overrideMaterial = null;
  scene.background = prevBg;
  hidden.forEach(o => (o.visible = true));
  const blur = (amt) => {
    blurQuad.material = hBlur; hBlur.uniforms.tDiffuse.value = shadowRT.texture; hBlur.uniforms.h.value = amt / 1024;
    renderer.setRenderTarget(shadowBlurRT); renderer.render(blurScene, blurCam);
    blurQuad.material = vBlur; vBlur.uniforms.tDiffuse.value = shadowBlurRT.texture; vBlur.uniforms.v.value = amt / 512;
    renderer.setRenderTarget(shadowRT); renderer.render(blurScene, blurCam);
  };
  blur(3.0); blur(2.0); blur(1.2);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, prevClear);
}

const FloorShader = {
  name: 'StudioFloor',
  uniforms: {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    tShadow: { value: shadowRT.texture }, uShadowScale: { value: new THREE.Vector2(1 / SHW, 1 / SHD) },
    uNear: { value: new THREE.Color(0x2b2d33) }, uFar: { value: new THREE.Color(0x15171b) },
    uReflect: { value: 0.55 }, uTexel: { value: new THREE.Vector2(1 / 1024, 1 / 1024) },
    uFlow: { value: 0 }, uOffset: { value: 0 }, uCurv: { value: 0 },
  },
  vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main(){ vUv = textureMatrix * vec4(position,1.0); vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D tShadow; uniform vec2 uShadowScale;
    uniform vec3 uNear; uniform vec3 uFar; uniform float uReflect; uniform vec2 uTexel; uniform float uFlow; uniform float uOffset; uniform float uCurv;
    varying vec4 vUv; varying vec3 vWorld;
    #include <logdepthbuf_pars_fragment>
    void main(){
      #include <logdepthbuf_fragment>
      vec2 uv = vUv.xy / vUv.w;
      vec3 r = textureLod(tDiffuse, uv, 1.0).rgb * 0.24;
      vec2 o = uTexel * 3.5;
      r += textureLod(tDiffuse, uv + vec2( o.x, 0.0), 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2(-o.x, 0.0), 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2(0.0,  o.y), 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2(0.0, -o.y), 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2( o.x,  o.y) * 0.7, 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2(-o.x,  o.y) * 0.7, 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2( o.x, -o.y) * 0.7, 1.6).rgb * 0.095;
      r += textureLod(tDiffuse, uv + vec2(-o.x, -o.y) * 0.7, 1.6).rgb * 0.095;
      float d = length(vWorld.xz * vec2(0.105, 0.15));
      vec3 base = mix(uNear, uFar, smoothstep(0.0, 1.0, d));
      vec2 suv = vWorld.xz * uShadowScale + 0.5;
      float inside = step(0.0, suv.x) * step(suv.x, 1.0) * step(0.0, suv.y) * step(suv.y, 1.0);
      float sh = texture2D(tShadow, suv).a * inside;
      base *= 1.0 - 0.93 * clamp(sh, 0.0, 1.0);
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = 0.04 + 0.96 * pow(1.0 - clamp(V.y, 0.0, 1.0), 5.0);
      float k = uReflect * mix(0.32, 1.0, fres) * (1.0 - smoothstep(0.45, 1.1, d));
      vec3 col = base + r * k;
      if (uFlow > 0.001) {
        // along/across coordinates of a road that bends with curvature uCurv (centre on the +z side when positive)
        float along = vWorld.x, across = vWorld.z;
        if (abs(uCurv) > 1e-4) {
          float R = 1.0 / uCurv, sR = sign(R);
          float r = length(vec2(vWorld.x, vWorld.z - R));
          across = R - sR * r;
          along = atan(vWorld.x, sR * (R - vWorld.z)) * abs(R);
        }
        float fx = along + uOffset;
        float azf = abs(across);
        float bw = 0.02 + 0.10 * uFlow;
        float ph = fract(fx / 5.0);
        float dash = smoothstep(0.30 - bw, 0.30 + bw, ph) * (1.0 - smoothstep(0.78 - bw, 0.78 + bw, ph));
        float lane = (1.0 - smoothstep(0.035, 0.07, abs(azf - 1.85))) * dash + (1.0 - smoothstep(0.05, 0.09, abs(azf - 4.2)));
        float band = floor(across * 5.0);
        float hs = fract(sin(band * 91.7 + 3.1) * 43758.5453);
        float streak = smoothstep(0.86, 1.0, fract(fx * (0.18 + 0.2 * hs) + hs * 7.0)) * step(0.62, hs);
        float fade = 1.0 - smoothstep(0.35, 1.05, d);
        col += (vec3(0.075) * lane + vec3(0.028) * streak) * uFlow * fade * (1.0 - 0.85 * clamp(sh, 0.0, 1.0));
      }
      col = mix(col, uFar, smoothstep(0.8, 1.6, d));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};

      if (mus.next < t - 0.25) mus.next = t + 0.05;
      while (mus.next < t + 0.22) { playStep(mus.step, mus.next); mus.step++; mus.next += STEP; }
    }

}

function setSound(on) {
  SND.on = on;
  if (on && !SND.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { SND.on = false; syncUI(); return; }
    SND.ctx = new AC({ latencyHint: 'interactive' });

  if (SND.ctx) {
    if (on) SND.ctx.resume();
    SND.eng.out.gain.setTargetAtTime(on ? 0.9 : 0, SND.ctx.currentTime, 0.08);

}
function audioFrame(dt) {

}
document.addEventListener('visibilitychange', () => {

/* ---------- UI ---------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const swatchBg = (c) => `radial-gradient(circle at 34% 30%, ${c[0]} 0%, ${c[1]} 46%, ${c[2]} 100%)`;
const CARBON_BG = 'repeating-linear-gradient(45deg, #2c2d31 0 3px, #101113 3px 6px)';
const radio = (key, o, cls, inner, style = '') => `<button type="button" class="${cls}" role="radio" data-opt="${key}" data-val="${o.id}" aria-checked="false" title="${o.name}"${style ? ` style="${style}"` : ''}>${inner}</button>`;
const sr = (t) => `<span class="sr">${t}</span>`;
function wheelIcon(id) {
  let paths = '';
  for (const a of spokeArms(id)) {
    let d = '';
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, r = lerp(4.4, 13.0, t), th = a.th(t);
      d += (i ? 'L' : 'M') + (16 + r * Math.cos(th)).toFixed(2) + ' ' + (16 - r * Math.sin(th)).toFixed(2);
    }

  return `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="16" cy="16" r="3.6" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round">${paths}</g></svg>`;
}
function liveryIcon(id) {
  const body = '<rect x="3" y="7" width="38" height="18" rx="7" fill="currentColor" opacity=".28"/>';
  const clip = '<clipPath id="lv-' + id + '"><rect x="3" y="7" width="38" height="18" rx="7"/></clipPath>';
  const pats = {
    none: '',
    twin: '<rect x="3" y="13.4" width="38" height="2.2" fill="currentColor"/><rect x="3" y="16.4" width="38" height="2.2" fill="currentColor"/>',
    offset: '<rect x="3" y="9.6" width="38" height="4.4" fill="currentColor"/>',
    twotone: '<rect x="3" y="18" width="38" height="8" fill="currentColor"/>',
    hoop: '<path d="M24 5 L31 5 L22 27 L15 27 Z" fill="currentColor"/>',
  };
  return `<svg viewBox="0 0 44 32" aria-hidden="true"><defs>${clip}</defs>${body}<g clip-path="url(#lv-${id})">${pats[id] || ''}</g></svg>`;
}
function buildUI() {
  $('#presets').innerHTML = PRESETS.map((p, i) => {
    const paint = byId(PAINTS, p.paint), rim = byId(RIMS, p.rim), cal = byId(CALIPERS, p.caliper);
    const look = p.finish === 'carbon' ? CARBON_BG : swatchBg(paint.chip);
    return `<button type="button" class="preset" role="radio" data-preset="${i}" aria-checked="false">
      <span class="preset-look"><span class="pc big" style="background:${look}"></span><span class="pc" style="background:${rim.chip ? swatchBg(rim.chip) : CARBON_BG}"></span><span class="pc small" style="background:${cal.color}"></span></span>

  }).join('');
  $('#paints').innerHTML = PAINTS.map((p) => radio('paint', p, 'sw', sr(p.name), `background:${swatchBg(p.chip)}`)).join('');
  $('#finishes').innerHTML = FINISHES.map((f) => radio('finish', f, 'chip', `<span class="fin" data-fin="${f.id}"></span><span>${f.name}</span>`)).join('');
  $('#wheelDesigns').innerHTML = WHEELS.map((w) => radio('wheel', w, 'chip tile', `${wheelIcon(w.id)}<span>${w.name}</span>`)).join('');
  $('#rims').innerHTML = RIMS.map((r) => radio('rim', r, 'sw sm', sr(r.name), `background:${r.chip ? swatchBg(r.chip) : CARBON_BG}`)).join('');
  $('#calipers').innerHTML = CALIPERS.map((c) => radio('caliper', c, 'sw sm', sr(c.name), `background:${c.color}`)).join('');
  $('#wings').innerHTML = WINGS.map((w) => radio('wing', w, 'chip', `<span>${w.name}</span>`)).join('');
  $('#kits').innerHTML = KITS.map((k) => radio('kit', k, 'chip', `<span>${k.name}</span>`)).join('');
  $('#liveries').innerHTML = LIVERIES.map((l) => radio('livery', l, 'chip tile', `${liveryIcon(l.id)}<span>${l.name}</span>`)).join('');
  $('#cabins').innerHTML = CABINS.map((c) => radio('cabin', c, 'chip', `<span class="duo" style="background:linear-gradient(135deg, ${c.seat} 0 56%, ${c.accent} 56% 100%)"></span><span>${c.name}</span>`)).join('');

  const panel = panelEl();
  panel.addEventListener('click', (e) => {
    const b = e.target.closest('[data-opt]'); if (b) { setOption(b.dataset.opt, b.dataset.val); return; }
    const p = e.target.closest('[data-preset]'); if (p) { applyPreset(+p.dataset.preset); return; }
    const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
    if (e.target.closest('[data-panel-close]')) setPanel(false);
  });

  document.addEventListener('keydown', (e) => {
    if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
    const cur = e.target.closest && e.target.closest('[role="radio"]');
    const group = cur && cur.closest('[role="radiogroup"]');

    const i = items.indexOf(cur), n = items.length;

  });
  $$('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.toggle;
